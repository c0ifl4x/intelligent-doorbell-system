name: Build and create docker image of relay server

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/relay-server.yml'
      - 'iha-relay-server/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Determinate build version
        id: version
        run: |
          echo "sha_full=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "sha_short=$(echo "${{ github.sha }}" | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Run tests
        run: ./gradlew :iha-relay-server:backend:test --no-daemon -PcommitHash=${{ steps.version.outputs.sha_full }}
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.sha_short }}

      - name: Build and push multi-arch Docker image with Jib
        run: ./gradlew :iha-relay-server:backend:jib --no-daemon -PcommitHash=${{ steps.version.outputs.sha_full }}
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.sha_short }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
