[versions]
jib = "3.5.4"
kotlin = "2.4.21"
logback = "1.5.32"
webEmbed = "1.0.0"

[libraries]
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

[plugins]
frontend-builder = { id = "pl.miloszgilga.gradle.frontend-builder", version.ref = "webEmbed" }
jib = { id = "com.google.cloud.tools.jib", version.ref = "jib" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
web-embed = { id = "pl.miloszgilga.gradle.web-embed", version.ref = "webEmbed" }
